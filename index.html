<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>暮影傳說</title><style> *{box-sizing:border-box}body{margin:auto;max-width:650px;background:#101317;color:#ddd3bd;font:15px system-ui;padding:12px}h1,h3{color:#d9b77b;margin:8px 0}button,select,input{background:#292c31;color:#ead9b6;border:1px solid #766344;border-radius:6px;padding:10px;font:inherit}button{cursor:pointer}section{border:1px solid #504638;background:#1b1e23;padding:12px;margin:8px 0;border-radius:8px}nav{display:flex;flex-wrap:wrap;gap:6px}progress{width:100%;accent-color:#a74747;height:12px}canvas{width:100%;background:#23362b;border:1px solid #786344}small{color:#aaa}#log{height:125px;overflow:auto;white-space:pre-line;font-size:13px} .gold{color:#e8c57a}body{background:radial-gradient(ellipse at top,#252b30,#101317 65%);padding: max(12px,env(safe-area-inset-top)) 12px 20px}section{background:linear-gradient(145deg,#24272c,#15181d);box-shadow:inset 0 0 0 2px #1118}button{background:linear-gradient(#3c3933,#22252a)}nav button{flex:1;min-width:64px}canvas{border-radius:8px;box-shadow:0 4px 16px #0008}h1{letter-spacing:2px} </style><h1>暮影傳說 II <small>單機 RPG</small></h1><section id="stats"></section><canvas id="scene" width="480" height="260"></canvas><section><select id="map"></select> <button id="hunt" onclick="toggle()">開始狩獵</button><p id="enemy"></p><progress id="eh" value="0" max="100"></progress></section><nav id="nav"></nav><section id="panel"></section><section id="log"></section><small>本機存檔 · 原創像素素材 · 離線收益上限 8 小時</small><script>
const $=x=>document.getElementById(x), maps=[['晨霧森林',1,'哥布林',35,12,15],['荒廢地監',5,'骷髏戰士',95,28,35],['赤龍山谷',15,'飛龍',280,75,100],['暮影高塔',30,'暗影騎士',800,200,260]], jobs=['騎士','妖精','法師','暗影刺客','王族'], slots=['武器','盔甲','戒指','頭盔','斗篷','手套','鞋子','項鍊'], names=[['鐵劍','鋼刃','龍牙劍','暮影之刃'],['皮甲','鎖子甲','龍鱗甲','暮影戰甲'],['銅戒','銀戒','龍晶戒','暮影之戒'],['皮帽','鐵盔','龍盔','暮影冠'],['旅人斗篷','銀絲披風','龍翼披風','夜幕'],['皮手套','鐵手套','龍爪','暗影之握'],['布鞋','鐵靴','龍鱗靴','夜行靴'],['銅項鍊','銀項鍊','龍晶墜','暮影之心']];let s={job:0,lv:1,xp:0,hp:100,gold:300,pot:30,scroll:5,map:0,kills:0,bag:[],gear:[{slot:0,t:0,p:0,id:1},null,null],next:2,active:false,last:Date.now(),form:0,pet:0,rate:1};try{let a=JSON.parse(localStorage.getItem('twilight-v1'));if(a&&a.gear&&a.bag)Object.assign(s,a)}catch(e){}while(s.gear.length<8)s.gear.push(null);s.attr=s.attr||[0,0,0,0,0];s.spent=s.spent||0;s.mp=s.mp??50;s.auto=s.auto||[true,true,false];s.collection=s.collection||{};let hp=35,tab='角色',logs=[],tick=0;const maxhp=()=>100+(s.lv-1)*18+s.attr[2]*12, need=()=>s.lv*80, power=()=>8+s.lv*3+s.attr[0]*3+s.attr[1]+(s.gear[0]?s.gear[0].t*14+s.gear[0].p*4:0)+s.form*4+s.pet*3, defense=()=>s.gear.slice(1).reduce((a,g)=>a+(g?g.t*4+g.p*2+2:0),0);function save(){s.last=Date.now();try{localStorage.setItem('twilight-v1',JSON.stringify(s))}catch(e){}}function msg(t){logs.unshift(t);$('log').textContent=logs.slice(0,35).join('\n')}function item(g){return '+'+g.p+' '+names[g.slot][g.t]}function reward(boss=false){let m=maps[s.map];s.kills++;s.xp+=m[4]*s.rate*(boss?5:1);s.gold+=m[5]*s.rate*(boss?5:1);if(Math.random()<.18)s.scroll++;if(Math.random()<.25)s.pot++;if(Math.random()<(boss?.9:.09)){let g={slot:Math.floor(Math.random()*8),t:s.map,p:0,id:s.next++};s.collection[g.slot+'-'+g.t]=true;if(s.auto[2]&&g.t===0){s.gold+=50}else{s.bag.push(g);msg('掉落 '+item(g))}}while(s.xp>=need()){s.xp-=need();s.lv++;s.hp=maxhp();msg('升級 Lv.'+s.lv)} }function step(offline=false){if(!s.active)return;let m=maps[s.map],boss=(s.kills+1)%25===0;s.mp=Math.min(50+s.attr[3]*5,s.mp+2);let skill=s.auto[1]&&s.mp>=10;if(skill)s.mp-=10;hp-=power()*(.85+Math.random()*.3)*(skill?[1.5,1.6,2,1.8,1.4][s.job]+s.attr[4]*.03:1);s.hp-=Math.max(1,Math.floor(m[3]/12*(boss?2:1)-defense()));if(s.hp<maxhp()*.5&&s.pot&&s.auto[0]){s.pot--;s.hp=Math.min(maxhp(),s.hp+60)}if(s.hp<=0){s.hp=0;s.active=false;if(!offline)msg('狩獵中止：生命耗盡');return}if(hp<=0){reward(boss);if(!offline)msg('擊殺 '+(boss?'首領 ':'')+m[2]);hp=m[3]*((s.kills+1)%25===0?4:1)} }function toggle(){if(!s.hp){msg('請先恢復生命');return}s.active=!s.active;render();save()}function act(fn){fn();render();save()}function equip(id){act(()=>{let i=s.bag.findIndex(g=>g.id===id);if(i<0)return;let g=s.bag.splice(i,1)[0];if(s.gear[g.slot])s.bag.push(s.gear[g.slot]);s.gear[g.slot]=g})}function upgrade(i){act(()=>{let g=s.gear[i];if(!g||!s.scroll)return msg('沒有裝備或卷軸');s.scroll--;if(g.p<(i===0?6:4)||Math.random()<.35){g.p++;msg('強化成功 '+item(g))}else{s.gear[i]=null;msg('強化失敗，裝備消失')}})}function buy(k,c,n){act(()=>{if(s.gold<c)return msg('金幣不足');s.gold-=c;s[k]+=n})}function point(i){act(()=>{if(s.spent<s.lv-1){s.attr[i]++;s.spent++}})}function render(){ $('stats').innerHTML=`<b>Lv.${s.lv} ${jobs[s.job]}</b>　<span class=gold>金幣 ${s.gold}</span><br>HP ${s.hp}/${maxhp()}<progress value=${s.hp} max=${maxhp()}></progress>EXP ${s.xp}/${need()}<progress style="accent-color:#b49a54" value=${s.xp} max=${need()}></progress>MP ${s.mp}/${50+s.attr[3]*5}<progress style="accent-color:#507db6" value=${s.mp} max=${50+s.attr[3]*5}></progress>攻擊 ${power()}　防禦 ${defense()}　擊殺 ${s.kills}`;$('hunt').textContent=s.active?'停止狩獵':'開始狩獵';$('enemy').textContent=((s.kills+1)%25===0?'首領 · ':'')+maps[s.map][2];$('eh').max=maps[s.map][3]*((s.kills+1)%25===0?4:1);$('eh').value=Math.max(0,hp);let p='';if(tab==='角色')p=`<h3>角色</h3>職業：${jobs[s.job]}<p>紅水 ${s.pot}　強化卷 ${s.scroll}</p><button onclick="act(()=>{if(s.pot){s.pot--;s.hp=Math.min(maxhp(),s.hp+60)}})">喝紅水</button> <button onclick="act(()=>{if(s.gold>=30){s.gold-=30;s.hp=maxhp()}})">旅館休息 30 金</button><p>初期可自由轉職</p>`+jobs.map((j,i)=>`<button onclick="act(()=>s.job=${i})">${j}</button>`).join('');if(tab==='能力')p='<h3>能力配點 · 剩餘 '+(s.lv-1-s.spent)+'</h3>'+['力量','敏捷','體質','精神','智力'].map((n,i)=>`<p>${n}　${10+s.attr[i]} <button onclick="point(${i})">＋</button></p>`).join('')+'<p>自動技能：'+['重擊','穿透箭','火球術','暗影斬','王者之擊'][s.job]+'</p>';if(tab==='圖鑑')p='<h3>裝備收藏 '+Object.keys(s.collection).length+'/32</h3>'+names.map((a,i)=>'<p>'+slots[i]+'：'+a.map((n,j)=>s.collection[i+'-'+j]?n:'？？').join(' · ')+'</p>').join('');if(tab==='裝備')p=slots.map((v,i)=>`<p>${v}：${s.gear[i]?item(s.gear[i]):'空'} <button onclick="upgrade(${i})">強化</button></p>`).join('')+'<small>武器安定 +6，其餘 +4，超過安定值失敗會消失。</small>';if(tab==='背包')p=s.bag.length?s.bag.map(g=>`<p>${item(g)} <button onclick="equip(${g.id})">裝備</button> <button onclick="act(()=>{s.bag=s.bag.filter(x=>x.id!==${g.id});s.gold+=${50+g.t*100}})">出售</button></p>`).join(''):'尚無掉落裝備';if(tab==='商店')p='<button onclick="buy(\'pot\',100,20)">紅水 ×20 / 100 金</button> <button onclick="buy(\'scroll\',200,1)">強化卷 / 200 金</button> <button onclick="act(()=>{if(s.gold>=100){s.gold-=100;s.bag.push({slot:0,t:0,p:0,id:s.next++})}})">鐵劍 / 100 金</button>';if(tab==='變身')p=['解除變身','森林遊俠','銀甲戰士','暗影死神'].map((v,i)=>`<p><button onclick="act(()=>{if(s.lv>=${i*10})s.form=${i};else msg('等級不足')})">${v} Lv.${i*10}</button> ${s.form===i?'使用中':''}</p>`).join('')+'<button onclick="act(()=>{if(!s.pet&&s.gold>=1000){s.gold-=1000;s.pet=1}})">召喚魔法娃娃 1000 金</button> '+(s.pet?'已召喚':'');if(tab==='設定')p=['自動喝水','自動施法','自動出售普通裝備'].map((n,i)=>`<p><label><input type=checkbox ${s.auto[i]?'checked':''} onchange="act(()=>s.auto[${i}]=this.checked)"> ${n}</label></p>`).join('')+`<p>收益倍率 <select onchange="act(()=>s.rate=Number(this.value))">${[1,2,5,10].map(i=>`<option ${s.rate===i?'selected':''}>${i}</option>`).join('')}</select></p><button onclick="exportSave()">匯出存檔</button> <input type=file accept="application/json" onchange="importSave(this.files[0])">`; $('panel').innerHTML=p}function exportSave(){save();let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(s)],{type:'application/json'}));a.download='twilight-save.json';a.click()}async function importSave(f){try{let a=JSON.parse(await f.text());if(!Array.isArray(a.gear)||!Array.isArray(a.bag)||!Number.isFinite(a.lv))throw 0;Object.assign(s,a);s.active=false;$('map').value=s.map;render();save()}catch(e){msg('存檔無效')}}$('map').innerHTML=maps.map((m,i)=>`<option value=${i}>${m[0]} Lv.${m[1]}</option>`).join('');$('map').value=s.map;$('map').onchange=()=>{let i=+$('map').value;if(s.lv<maps[i][1]){msg('等級不足');$('map').value=s.map;return}s.map=i;hp=maps[i][3];render();save()};['角色','能力','裝備','背包','商店','變身','圖鑑','設定'].forEach(t=>{let b=document.createElement('button');b.textContent=t;b.onclick=()=>{tab=t;render()};$('nav').append(b)});hp=maps[s.map][3];let elapsed=Math.min(28800,Math.max(0,(Date.now()-s.last)/1000));if(s.active&&elapsed>10){let old=s.kills;for(let i=0;i<Math.floor(elapsed/2)&&s.active;i++)step(true);msg('離線狩獵擊殺 '+(s.kills-old)+' 隻')}render();save();setInterval(()=>{if(s.active){step();render();save()}},2000);let c=$('scene'),ctx=c.getContext('2d');function draw(){tick++;let dark=s.map>0;const C=ctx;function poly(points,color){C.fillStyle=color;C.beginPath();points.forEach(([x,y],i)=>i?C.lineTo(x,y):C.moveTo(x,y));C.closePath();C.fill()}function r(x,y,w,h,k){C.fillStyle=k;C.fillRect(x,y,w,h)}let grad=C.createLinearGradient(0,0,0,260);grad.addColorStop(0,dark?'#141622':'#132d29');grad.addColorStop(1,dark?'#44404b':'#526044');C.fillStyle=grad;C.fillRect(0,0,480,260);for(let i=-5;i<14;i++)for(let j=0;j<9;j++){let x=i*48+(j%2)*24,y=75+j*22;poly([[x,y],[x+24,y-12],[x+48,y],[x+24,y+12]],dark?['#393841','#414049','#33333c'][(i+j+30)%3]:['#344c36','#40543a','#485b3e'][(i+j+30)%3]);}for(let i=0;i<10;i++){let x=i*55-15,y=55+(i%3)*9;if(dark){r(x,y-48,23,65,'#292a33');r(x+4,y-45,12,60,'#54515a');r(x-4,y-50,31,8,'#77717a')}else{r(x+16,y-35,10,53,'#5b4430');for(let j=0;j<4;j++)poly([[x-8+j*3,y-12-j*11],[x+20,y-65-j*4],[x+48-j*3,y-12-j*11]],['#17392e','#214838','#2e5940','#42664a'][j]);}}for(let i=0;i<60;i++){let x=(i*73)%480,y=100+(i*37)%155;r(x,y,2,2,dark?'#777078':'#7a8050')}function sprite(x,y,monster){let bob=s.active?Math.round(Math.sin(tick/6)*2):0;y+=bob;C.fillStyle='#0007';C.beginPath();C.ellipse(x,y+4,23,8,0,0,7);C.fill();C.save();C.translate(x,y);let metal=monster?'#78864b':'#aab8c5',shade=monster?'#455638':'#536778',light=monster?'#a9ae69':'#e0e5df';poly([[-12,-30],[0,-37],[13,-30],[11,-10],[-10,-10]],shade);poly([[-10,-29],[0,-34],[9,-29],[6,-13],[-7,-13]],metal);r(-10,-12,8,15,shade);r(3,-12,8,15,shade);r(-13,0,12,4,'#25282b');r(2,0,13,4,'#25282b');poly([[-17,-29],[-8,-35],[-5,-25],[-13,-15],[-20,-18]],metal);poly([[8,-34],[17,-29],[20,-17],[12,-14],[7,-25]],shade);poly([[-11,-48],[0,-55],[11,-48],[10,-36],[0,-32],[-10,-37]],metal);poly([[-11,-48],[0,-55],[11,-48],[0,-45]],light);r(-8,-43,16,4,'#20282b');r(-6,-42,3,2,monster?'#ffb650':'#a9e3ff');r(4,-42,3,2,monster?'#ffb650':'#a9e3ff');poly([[-12,-30],[-24,-24],[-22,-9],[-12,-4],[-5,-18]],monster?'#6d5138':'#896d43');poly([[-13,-27],[-20,-23],[-18,-11],[-12,-8],[-8,-18]],'#b49a62');C.rotate(s.active?Math.sin(tick/5)*.12:0);poly([[16,-15],[29,-55],[34,-61],[35,-51],[22,-12]],light);r(13,-19,15,4,'#c6a45e');C.restore();}sprite(190,181,false);sprite(295,181,true);if(s.active&&tick%35<12){C.strokeStyle='#f7dc91';C.lineWidth=3;C.beginPath();C.arc(252,145,38,-1.1,.7);C.stroke();C.fillStyle='#ffe0a0';C.font='bold 16px system-ui';C.fillText('−'+power(),286,115-tick%35)}C.fillStyle='#e7d7b2';C.font='12px system-ui';C.fillText(jobs[s.job],174,200);C.fillText(maps[s.map][2],275,200);requestAnimationFrame(draw)}draw();</script></html>
